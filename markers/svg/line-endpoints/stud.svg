<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Polity stud: white-fill ring + ink dot. currentColor = --map-label ink. -->
  <!-- White ring (outer) -->
  <circle cx="12" cy="12" r="8" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
  <!-- Ink dot (inner) -->
  <circle cx="12" cy="12" r="4" fill="currentColor"/>
</svg>
