# Netlify deploy config for InvaderGIS (static SPA).
#
# IMPORTANT: `npm run build` runs `npm run bake` first (prebuild hook), which
# regenerates public/data + public/index from data/. public/index is gitignored,
# so the bake MUST run in CI/deploy or the search + network/timeline indexes ship
# empty. The prebuild hook guarantees this.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. The app is a single page with hash-based deep links (#page=...),
# so server-side path routing is not used — but serve index.html for any path so
# a stray deep path returns the app rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (mirror of public/_headers + the index.html CSP meta).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
