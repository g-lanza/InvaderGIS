<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas Redesign · print</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    @page { size: 1280px 800px; margin: 0; }

    html, body {
      background: #ffffff;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Each page: 1280 × 800 with breaks */
    .page, .cover {
      width: 1280px;
      height: 800px;
      box-sizing: border-box;
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    /* Cover */
    .cover {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: var(--surface);
    }
    .cover-inner { max-width: 760px; }

    /* TOC */
    .page-toc {
      padding: 60px 80px;
    }
    .toc-grid {
      column-count: 2;
      column-gap: 40px;
    }

    /* Artboard page */
    .page-art {
      padding: 24px 80px 28px;
      display: flex;
      flex-direction: column;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-mid);
      margin-bottom: 12px;
    }
    .page-body {
      margin: 0 auto;
      background: var(--surface);
    }

    /* No animation in print */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  </style>
</head>
